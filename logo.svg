<svg xmlns="http://w3.org" viewBox="0 0 420 110" width="420" height="110">
  <defs>
    <linearGradient id="yctvnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <!-- Biểu tượng Play cách điệu (YouTube Core) -->
  <rect x="12" y="18" width="74" height="54" rx="14" fill="url(#playGrad)" />
  <polygon points="42,33 42,57 63,45" fill="#FFFFFF" />

  <!-- Chữ YCTVN đậm nét hiện đại -->
