  <!-- Dòng chữ phụ YouTube Core Team Vietnam -->
  <text x="106" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="11.5" letter-spacing="2.2" fill="#64748B">YOUTUBE CORE TEAM VIETNAM</text>
</svg>
